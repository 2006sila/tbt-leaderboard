name: 发布榜单站点

# main 上 web/ 有变动就重新发布；也可以被 verify.yml 显式触发
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 注意：group 用 run_id，不要用固定的 "pages"。
# 原因（2026-09-13 实测）：固定的 group 一旦被 cancel 的 run 残留占住，
# 后续同组 run 会永远停在 queued，界面上不给任何提示 —— 白等过 30 分钟。
concurrency:
  group: pages-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取仓库
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
